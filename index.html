<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jannat-e-Noor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090611;
        --panel: rgba(20, 16, 32, 0.92);
        --text: #f7f0ff;
        --muted: #c8b8dd;
        --accent: #d28cff;
        --accent-2: #8a63ff;
        --border: #34274f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: var(--text);
        background: linear-gradient(135deg, #140f24 0%, var(--bg) 100%);
      }

      body > div:first-of-type {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .hero-title {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--accent);
        text-shadow: 0 2px 10px rgba(210, 140, 255, 0.22);
      }

      .hero-subtitle {
        margin: 0 0 18px;
        font-size: 1.05rem;
        color: var(--muted);
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 1rem;
      }

      img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 16px 0 28px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        object-fit: cover;
      }

      section,
      form,
      #message {
        max-width: 900px;
        margin: 0 auto 24px;
        padding: 24px;
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(10px);
      }

      section {
        border: 1px solid var(--border);
      }

      form {
        display: grid;
        gap: 16px;
      }

      form > div {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      form > div:last-child {
        flex-direction: row;
        gap: 12px;
        flex-wrap: wrap;
      }

      label {
        font-weight: 600;
        color: #f4e7ff;
      }

      input,
      button {
        width: 100%;
        font: inherit;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }

      input {
        background: #1b142b;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(210, 140, 255, 0.18);
      }

      button {
        cursor: pointer;
        font-weight: 700;
        border: none;
        color: #fff;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow: 0 10px 20px rgba(138, 99, 255, 0.24);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(138, 99, 255, 0.28);
      }

      button[type="button"] {
        background: #2d233f;
        color: var(--text);
        border: 1px solid #47365d;
        box-shadow: none;
      }

      #message {
        display: none;
        margin-top: 16px;
        font-weight: 700;
        border: 1px solid rgba(0, 0, 0, 0.06);
      }

      #loaderOverlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(7, 5, 12, 0.7);
        backdrop-filter: blur(8px);
        z-index: 1000;
      }

      .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 28px;
        border-radius: 20px;
        background: rgba(25, 19, 40, 0.95);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      }

      .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(185, 94, 215, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-card p {
        margin: 0;
        color: var(--text);
        font-weight: 600;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        body > div:first-of-type {
          padding: 16px 14px 28px;
        }

        section,
        form,
        #message {
          padding: 18px;
          border-radius: 18px;
        }

        form > div:last-child {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>

    <div>
      <h2 class="hero-title">Jannat-e-Noor</h2>
      <p class="hero-subtitle">Luxury male-to-female massage experience in a soothing, private setting.</p>
      <img src="image_1.jpeg" />
      <p class="hero-subtitle">Our fully trained masseurs are the best in town.</p>
      <img src="image_2.jpeg" />
      <p class="hero-subtitle">Just fill out the contact form and our masseur will come to your location specified location.</p>
      <img src="image_3.jpeg" />
    </div>

    <section>
      <h4 style="text-align: center;">Contact Form</h4>
    </section>

    <form id="form" novalidate>
      <div>
        <label>Name</label>
        <div>
          <input type="text" placeholder="Name" name="Name" required />
        </div>
      </div>

      <div>
        <label>Age</label>
        <div>
          <input type="number" placeholder="Your Age" name="Age" required />
        </div>
      </div>

      <div>
        <label>Contact</label>
        <div>
          <input type="tel" inputmode="numeric" pattern="[0-9]{10}" placeholder="Your Phone" name="Contact" required />
        </div>
      </div>

      <div>
        <label>Address 1</label>
        <div>
          <input type="text" placeholder="Address 1" name="Address 1" required />
        </div>
      </div>

      <div>
        <label>Address 2</label>
        <div>
          <input type="text" placeholder="Address 2" name="Address 2" required />
        </div>
      </div>

      <div>
        <label>City</label>
        <div>
          <input
            type="text"
            placeholder="City"
            name="City"
            value="Bengaluru"
            readonly="true"
            required
          />
        </div>
      </div>

      <div>
        <label>State</label>
        <div>
          <input
            type="text"
            placeholder="State"
            name="State"
            value="Karnataka"
            readonly="true"
            required
          />
        </div>
      </div>

      <div>
        <div>
          <button type="submit" id="submit-button">Submit</button>
        </div>
        <div>
          <button type="button" onclick="document.getElementById('form').reset();">
            Cancel
          </button>
        </div>
      </div>
    </form>
    <div
      id="message"
      style="
        display: none;
        margin: 20px;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
      "
    ></div>

    <div id="loaderOverlay" aria-live="polite" aria-label="Loading">
      <div class="loader-card">
        <div class="spinner"></div>
        <p>Booking your massage request...</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("form");
      const submitButton = document.getElementById("submit-button");
      const messageDiv = document.getElementById("message");
      const loaderOverlay = document.getElementById("loaderOverlay");


      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const requiredInputs = Array.from(form.querySelectorAll("input[required]"));
        const emptyField = requiredInputs.find((input) => input.value.trim() === "");

        if (emptyField) {
          messageDiv.textContent = "Please fill in all required fields.";
          messageDiv.style.display = "block";
          messageDiv.style.backgroundColor = "#f14668";
          messageDiv.style.color = "white";
          emptyField.focus();
          return;
        }

        const phoneInput = form.querySelector('input[name="Contact"]');
        const phoneValue = phoneInput.value.trim();

        if (!/^\d{10}$/.test(phoneValue)) {
          messageDiv.textContent = "Please enter a valid 10-digit phone number.";
          messageDiv.style.display = "block";
          messageDiv.style.backgroundColor = "#f14668";
          messageDiv.style.color = "white";
          phoneInput.focus();
          return;
        }

        messageDiv.textContent = "";
        messageDiv.style.display = "none";
        loaderOverlay.style.display = "flex";
        submitButton.disabled = true;

        try {
          const formData = new FormData(this);
          const formDataObj = {};

          // Convert FormData to object
          for (let [key, value] of formData.entries()) {
            formDataObj[key] = value;
          }

          // Submit form data
          const scriptURL =
            "https://script.google.com/macros/s/AKfycbwwtndtR2PNCdoqlGjLNj4wA_s0yRFujtRLnQIJEvs7JBhwGNeGPIeMbF6fFEB5dbuC/exec";

          const params = new URLSearchParams(formDataObj).toString();

          await fetch(scriptURL, {
            redirect: "follow",
            method: "POST",
            mode: "no-cors",
            body: params,
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            },
          });

          messageDiv.textContent = "Submitted successfully!";
          messageDiv.style.backgroundColor = "#48c78e";
          messageDiv.style.color = "white";
          form.reset();
        } catch (error) {
          console.error("Error:", error);
          messageDiv.textContent = "Error: " + error.message;
          messageDiv.style.backgroundColor = "#f14668";
          messageDiv.style.color = "white";
        } finally {
          loaderOverlay.style.display = "none";
          submitButton.disabled = false;

          setTimeout(() => {
            messageDiv.textContent = "";
            messageDiv.style.display = "none";
          }, 4000);
        }
      });

      // Enhance cancel button to reset file input display
      const cancelButton = form.querySelector('button[type="button"]');
      cancelButton.addEventListener("click", function () {
        form.reset();
        messageDiv.style.display = "none";
        loaderOverlay.style.display = "none";
      });
    </script>
  </body>
</html>
